name = "vault-storage-cdn"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# Custom Domain Configuration
# The custom domain cdn.yourvaultstorage.com is already active in Cloudflare dashboard.
# Uncomment the block below if you wish to manage the custom domain via Wrangler:
# routes = [
#   { pattern = "cdn.yourvaultstorage.com/*", custom_domain = true }
# ]

# Note on Secrets:
# The following environment secrets are securely stored on Cloudflare:
# - B2_APPLICATION_KEY
# - B2_APPLICATION_KEY_ID
# - CDN_SIGNING_SECRET
#
# DO NOT put plaintext secrets here. For local development, define them in .dev.vars.
